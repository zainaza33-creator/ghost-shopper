<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#1B2B6B" />
  <title>Reset password — Ghost Stores</title>
  
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/store-auth.css" />
</head>
<body class="gs-auth-body">

  <!-- HEADER -->
  <header class="gs-auth-header">
    <a href="index.html" class="gs-brand gs-brand-inline" style="text-decoration:none;">
      <img src="img/icon-192.png" alt="Ghost Stores" width="36" height="36" />
      <h1 class="gs-brand-title gs-brand-title-sm">Ghost <span class="gs-pill">Store</span></h1>
    </a>
    
    <div class="gs-auth-nav">
      <div class="desktop-auth-nav" style="display:flex; gap:12px;">
        <a href="index.html" class="gs-btn gs-btn-secondary">Home</a>
        <a href="login.html" class="gs-btn gs-btn-primary">Login</a>
      </div>
      <div class="gs-mobile-auth-toggle" id="mobileAuthToggle">
        <button class="gs-btn gs-btn-secondary" id="authAccessBtn">
          Access <i class="fas fa-chevron-down"></i>
        </button>
        <div class="gs-mobile-auth-dropdown" id="mobileAuthDropdown">
          <a href="index.html"><i class="fas fa-home"></i> Home</a>
          <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="gs-auth-main">
    <div class="gs-auth-card">
      <h2 class="gs-auth-title">Reset password</h2>
      <p class="gs-auth-sub">Enter your email and we'll send you a link to reset your password.</p>

      <form id="forgotForm" class="gs-form gs-form-compact">
        <div class="gs-field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <button type="submit" class="gs-btn gs-btn-primary gs-btn-full" id="resetBtn" style="margin-top:12px;">
          <i class="fas fa-paper-plane" aria-hidden="true"></i> Send reset link
        </button>

        <div id="forgotMessage" class="gs-message" role="status" aria-live="polite"></div>

        <div class="gs-auth-footer" style="padding-top:12px; margin-top:8px;">
          <p>Remembered it? <a href="login.html">Back to sign in</a></p>
        </div>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="gs-auth-page-footer">
    &copy; 2026 Ghost Shopper | Cloudskunk Hosting. All rights reserved.
  </footer>

  <script src="config/env.js"></script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/store-forgot.js"></script>
  <script>
    document.getElementById('authAccessBtn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('mobileAuthDropdown').classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if (!document.getElementById('mobileAuthToggle')?.contains(e.target)) {
        document.getElementById('mobileAuthDropdown')?.classList.remove('active');
      }
    });
  </script>
</body>
</html>
