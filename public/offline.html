<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1B2B6B" />
  <title>You're offline — Ghost Shopper</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 20px;
      margin: 0;
    }
    .offline-page {
      max-width: 460px;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      padding: 44px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .offline-icon {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--orange-soft);
      color: var(--orange);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 20px;
      position: relative;
    }
    .offline-icon::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(249,115,22,0.2);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .offline-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--navy);
      margin: 0 0 12px;
    }
    .offline-text {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0 0 22px;
    }
    .offline-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg);
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 22px;
    }
    .offline-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .offline-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: var(--radius-full);
      background: var(--orange);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      border: none;
      cursor: pointer;
      min-height: 46px;
      transition: background 0.2s, transform 0.15s;
    }
    .offline-retry:hover { background: var(--orange-dark); transform: translateY(-1px); }
    .offline-retry:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div class="offline-page">
    <div class="offline-icon"><i class="fas fa-wifi"></i></div>
    <h1 class="offline-title">You're offline</h1>
    <p class="offline-text">
      We'll reconnect automatically when your internet comes back.
      Your cart is saved and you can keep browsing when you're back online.
    </p>
    <div class="offline-status">
      <span class="dot"></span>
      <span>Waiting for connection…</span>
    </div>
    <br />
    <button class="offline-retry" id="retryBtn" type="button">
      <i class="fas fa-redo"></i> Retry Now
    </button>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <script>
    // Auto-reload when connection returns
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Manual retry button
    document.getElementById('retryBtn')?.addEventListener('click', function () {
      const btn = this;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking…';
      setTimeout(() => {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-redo"></i> Retry Now';
        }
      }, 800);
    });
  </script>
</body>
</html>
