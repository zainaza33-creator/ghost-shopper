<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#1B2B6B" />
  <meta name="description" content="Ghost Shopper — Admin Login." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ghost Admin" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="../img/favicon.png" />
  <link rel="apple-touch-icon" href="../img/icon-192.png" />
  <title>Ghost Shopper — Admin Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-login-body">

  <div class="admin-login-wrap">

    <div class="admin-login-card">
      <div class="admin-login-brand">
        <i class="fas fa-ghost" aria-hidden="true"></i>
        <span>Ghost<span>Shopper</span></span>
        <span class="admin-badge">Admin</span>
      </div>

      <h1>Admin Sign In</h1>
      <p class="admin-login-sub">Sign in with your email and password.</p>

      <form id="adminLoginForm" autocomplete="on">
        <div class="admin-login-field">
          <label for="adminEmail">Email Address</label>
          <input
            type="email"
            id="adminEmail"
            name="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="admin-login-field">
          <label for="adminPassword">Password</label>
          <div class="admin-login-password-wrap">
            <input
              type="password"
              id="adminPassword"
              name="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="admin-login-eye" id="togglePassword" aria-label="Show password">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="admin-login-btn" id="adminLoginBtn">
          <span>Sign In</span>
          <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>

      </form>

      <div class="admin-login-status" id="adminLoginStatus"></div>
    </div>

    <p class="admin-login-footer">
      &copy; 2026 Ghost Shopper · CloudSkunk Hosting
    </p>

  </div>

  <script src="../config/env.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
