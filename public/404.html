<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1B2B6B" />
  <title>Page not found — Ghost Shopper</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 20px;
      margin: 0;
    }
    .error-page {
      max-width: 460px;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      padding: 44px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .error-ghost {
      font-size: 4rem;
      color: var(--orange);
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .error-code {
      font-size: 3rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0 0 8px;
    }
    .error-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--navy);
      margin: 0 0 12px;
    }
    .error-text {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0 0 26px;
    }
    .error-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-actions a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      min-height: 46px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .error-actions .btn-primary { background: var(--orange); color: #fff; }
    .error-actions .btn-primary:hover { background: var(--orange-dark); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(249,115,22,0.3); }
    .error-actions .btn-secondary { background: var(--bg); color: var(--navy); border: 1px solid var(--border); }
    .error-actions .btn-secondary:hover { background: var(--border); }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-ghost"><i class="fas fa-ghost"></i></div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-text">
      We couldn't find that page. It may have moved, or the link might be broken.
      Let's get you back on track.
    </p>
    <div class="error-actions">
      <a href="index.html" class="btn-primary">
        <i class="fas fa-home"></i> Go Home
      </a>
      <a href="stores.html" class="btn-secondary">
        <i class="fas fa-store"></i> Browse Stores
      </a>
    </div>
  </div>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</body>
</html>
